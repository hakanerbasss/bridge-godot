name: Build Android APK
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Find Java
        run: |
          find /usr/lib/jvm -name "javac" 2>/dev/null || true
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 || true
          which java || true
          readlink -f $(which java) || true

      - name: Setup env
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java bulundu: $JAVA_PATH"
          mkdir -p $HOME/.config/godot
          mkdir -p $HOME/.local/share/godot/export_templates/4.2.2.stable
          cp -rv /root/.local/share/godot/export_templates/4.2.2.stable/* $HOME/.local/share/godot/export_templates/4.2.2.stable/ || true
          cat > $HOME/.config/godot/editor_settings-4.2.tres << EOSET
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_PATH"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOSET
          cat $HOME/.config/godot/editor_settings-4.2.tres

      - name: Import project
        run: godot --headless --editor --quit 2>&1 || true

      - name: Restore settings after import
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          cat > $HOME/.config/godot/editor_settings-4.2.tres << EOSET
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_PATH"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOSET

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/bridge-builder.apk 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/*.apk
          retention-days: 7
