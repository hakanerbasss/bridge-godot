name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
             >> ~/.config/godot/editor_settings-4.3.tres
          # Build tools fix
          ls /usr/lib/android-sdk/build-tools/

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-debug "Android" \
            "$(pwd)/build/android/bridge-builder.apk" 2>&1
          ls -la build/android/ || echo "No APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
          retention-days: 30
          if-no-files-found: warn
