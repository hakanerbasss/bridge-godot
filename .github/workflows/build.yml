name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK
        run: apt-get update -qq && apt-get install -y -qq openjdk-17-jdk

      - name: Setup
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true
          mkdir -p $HOME/.config/godot
          mkdir -p $HOME/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* $HOME/.local/share/godot/export_templates/
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          echo '[gd_resource type="EditorSettings" format=3]' > $SETTINGS
          echo '' >> $SETTINGS
          echo '[resource]' >> $SETTINGS
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> $SETTINGS
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $SETTINGS
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $SETTINGS
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $SETTINGS
          echo 'export/android/debug_keystore_pass = "android"' >> $SETTINGS
          echo "--- adb ---"
          ls /usr/lib/android-sdk/platform-tools/adb || echo "ADB YOK"
          echo "--- build-tools ---"
          ls /usr/lib/android-sdk/build-tools/
          echo "--- apksigner ---"
          ls /usr/lib/android-sdk/build-tools/33.0.2/apksigner || echo "APKSIGNER YOK"
          echo "--- keystore ---"
          ls /root/debug.keystore || echo "KEYSTORE YOK"

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path $PWD --export-debug "Android" $PWD/build/android/bridge-builder.apk > /tmp/godot.log 2>&1 || true
          echo "=== SON 30 SATIR ==="
          tail -30 /tmp/godot.log
          echo "=== HATALAR ==="
          grep -i "error\|missing\|invalid\|cannot\|failed" /tmp/godot.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
