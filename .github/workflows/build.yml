name: Build Android APK
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates/4.2.stable
          cp -rv /root/.local/share/godot/export_templates/4.2.stable/*                  ~/.local/share/godot/export_templates/4.2.stable/ || true
          cat > ~/.config/godot/editor_settings-4.2.tres << EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
export/android/shutdown_adb_on_exit = true
EOF

      - name: Import project
        run: godot --headless --editor --quit 2>&1 || true

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android"                 build/android/bridge-builder.apk 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/*.apk
          retention-days: 7
