name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable
          cp /root/.config/godot/editor_settings-4.3.tres \
             ~/.config/godot/editor_settings-4.3.tres || true

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-debug "Android" \
            build/android/bridge-builder.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
          retention-days: 30
