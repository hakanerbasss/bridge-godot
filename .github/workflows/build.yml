name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
             >> ~/.config/godot/editor_settings-4.3.tres
          # apksigner kontrolu
          find /usr/lib/android-sdk -name "apksigner" 2>/dev/null
          java -version 2>&1

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-debug "Android" \
            build/android/bridge-builder.apk 2>&1
          ls -la build/android/ || echo "No APK generated"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
          if-no-files-found: warn
          retention-days: 30
