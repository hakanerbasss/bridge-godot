name: Build Android APK
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup env
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/4.2.2.stable
          cp -rv /root/.local/share/godot/export_templates/4.2.2.stable/* $HOME/.local/share/godot/export_templates/4.2.2.stable/ || true
          python3 setup_godot.py

      - name: Import project
        run: godot --headless --editor --quit 2>&1 || true

      - name: Restore settings
        run: python3 setup_godot.py

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/bridge-builder.apk 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/*.apk
          retention-days: 7
