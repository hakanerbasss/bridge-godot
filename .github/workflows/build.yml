name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Export Android
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment & Install JDK
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk
          mkdir -p $HOME/.config/godot
          mkdir -p $HOME/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* $HOME/.local/share/godot/export_templates/

      - name: Configure Editor Settings
        run: |
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.2.tres"
          echo '[gd_resource type="EditorSettings" format=3]' > $SETTINGS_FILE
          echo '' >> $SETTINGS_FILE
          echo '[resource]' >> $SETTINGS_FILE
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $SETTINGS_FILE
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $SETTINGS_FILE
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $SETTINGS_FILE
          echo 'export/android/debug_keystore_pass = "android"' >> $SETTINGS_FILE
          echo 'export/android/force_system_user = false' >> $SETTINGS_FILE
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> $SETTINGS_FILE

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/bridge-builder.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
