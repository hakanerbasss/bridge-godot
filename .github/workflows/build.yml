name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK
        run: apt-get update -qq && apt-get install -y -qq openjdk-17-jdk

      - name: Setup
        run: |
          mkdir -p $HOME/.config/godot
          mkdir -p $HOME/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* $HOME/.local/share/godot/export_templates/
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          echo '[gd_resource type="EditorSettings" format=3]' > $SETTINGS
          echo '' >> $SETTINGS
          echo '[resource]' >> $SETTINGS
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> $SETTINGS
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $SETTINGS
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $SETTINGS
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $SETTINGS
          echo 'export/android/debug_keystore_pass = "android"' >> $SETTINGS
          echo "=== Settings ===" && cat $SETTINGS
          echo "=== Java ===" && ls /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/bridge-builder.apk 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
