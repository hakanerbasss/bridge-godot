name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Setup Godot Editor Settings
        run: |
          mkdir -p $HOME/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo 'export/android/android_sdk_path = "/root/android-sdk"'
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"'
          } > $HOME/.config/godot/editor_settings-4.tres
          echo "=== SDK kontrol ==="
          ls /root/android-sdk/build-tools/ || echo "SDK bulunamadi"
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          echo "HOME=$HOME"
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/root/android-sdk"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' > ~/.config/godot/editor_settings-4.2.tres
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/root/android-sdk"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' > /root/.config/godot/editor_settings-4.2.tres
          echo "HOME config:" && cat ~/.config/godot/editor_settings-4.2.tres

      - name: Import
        run: godot --headless --editor --quit 2>&1 || true

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/bridge-builder.apk 2>&1
          ls -la build/android/ || echo "No APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
          retention-days: 30
          if-no-files-found: warn
