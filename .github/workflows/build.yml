name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
             >> ~/.config/godot/editor_settings-4.3.tres

      - name: Install Android template
        run: |
          mkdir -p android
          cp ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip android/
          cd android && unzip -q android_source.zip && rm android_source.zip
          echo "installed" > .build_version

      - name: Export PCK
        run: |
          godot --headless --export-pack "Android" android/assets/bridge-builder.pck 2>&1 || true
          ls -la android/assets/ || true

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
