name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.2.2.stable \
             ~/.local/share/godot/export_templates/4.2.2.stable
          cp /root/.config/godot/editor_settings-4.2.tres \
             ~/.config/godot/editor_settings-4.2.tres 2>/dev/null || \
          cat > ~/.config/godot/editor_settings-4.2.tres << 'SETTINGS'
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
SETTINGS
          echo "=== Settings ===" && cat ~/.config/godot/editor_settings-4.2.tres
          java -version 2>&1

      - name: Import
        run: godot --headless --editor --quit 2>&1 || true

      - name: Build APK
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-debug "Android" \
            build/android/bridge-builder.apk 2>&1
          ls -la build/android/ || echo "No APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-builder-apk
          path: build/android/bridge-builder.apk
          retention-days: 30
          if-no-files-found: warn
